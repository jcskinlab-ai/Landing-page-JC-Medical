<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diagnóstico de almacenamiento · Medique</title>
<style>
  :root{
    --bg:#0B1220; --surface:#131C2E; --surface2:#0F1726; --line:#22304A;
    --text:#E8EEF8; --mute:#8FA3C0; --accent:#6EA8FE;
    --ok:#1F8A5B; --warn:#C9821F; --bad:#C0285A;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 40px);
    -webkit-text-size-adjust:100%;
  }
  h1{font-size:19px; margin:0 0 4px; letter-spacing:-.2px}
  .sub{font-size:13px; color:var(--mute); margin:0 0 18px; line-height:1.45}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:15px; margin-bottom:13px}
  .card h2{font-size:13px; text-transform:uppercase; letter-spacing:.7px; color:var(--mute); margin:0 0 12px; font-weight:600}
  .big{font-size:31px; font-weight:650; letter-spacing:-1px; line-height:1.1}
  .big small{font-size:14px; font-weight:400; color:var(--mute); letter-spacing:0}
  .bar{height:9px; background:var(--surface2); border-radius:99px; overflow:hidden; margin:13px 0 8px}
  .bar i{display:block; height:100%; border-radius:99px}
  .note{font-size:12.5px; color:var(--mute); line-height:1.5}
  table{width:100%; border-collapse:collapse; font-size:13.5px}
  td{padding:8px 0; border-bottom:1px solid var(--line); vertical-align:top}
  tr:last-child td{border-bottom:0}
  td.k{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; word-break:break-all; padding-right:10px}
  td.v{text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; font-weight:600}
  .tag{display:inline-block; font-size:10.5px; padding:2px 7px; border-radius:99px; margin-left:6px; vertical-align:middle; font-weight:600; letter-spacing:.3px}
  .tag.bad{background:rgba(192,40,90,.18); color:#FF8FB0}
  .tag.ok{background:rgba(31,138,91,.18); color:#6FD9A6}
  .tag.warn{background:rgba(201,130,31,.18); color:#F0BC6B}
  button{
    -webkit-appearance:none; width:100%; padding:13px; border-radius:11px; font-size:15px;
    font-weight:600; border:1px solid var(--line); background:var(--surface2); color:var(--text);
    font-family:inherit; cursor:pointer; margin-top:4px;
  }
  button:active{opacity:.65}
  .alert{background:rgba(192,40,90,.12); border-radius:10px; padding:11px 13px; font-size:13px; line-height:1.5; color:#FFC2D4; margin-top:11px}
  .okline{background:rgba(31,138,91,.12); border-radius:10px; padding:11px 13px; font-size:13px; line-height:1.5; color:#9FE3C2; margin-top:11px}
  .foot{font-size:11.5px; color:var(--mute); text-align:center; margin-top:22px; line-height:1.6}
</style>
</head>
<body>

<h1>Diagnóstico de almacenamiento</h1>
<p class="sub">Lee lo que este navegador tiene guardado y muestra qué está ocupando el espacio.
<strong>No modifica ni borra nada.</strong></p>

<div id="app"></div>

<div class="foot">
  Página interna de Medique · solo lectura<br>
  Ábrela en el <strong>mismo navegador</strong> donde ves el error.
</div>

<script>
(function () {
  "use strict";

  var LS;
  try { LS = window.localStorage; } catch (e) { LS = null; }

  // Restos de un sondeo anterior interrumpido (pestaña cerrada a media medición). Si quedó, es una
  // clave nuestra ocupando espacio de balde: se borra siempre, antes de medir nada.
  try { LS.removeItem("__jcm_diag_probe__"); } catch (e) {}

  var app = document.getElementById("app");
  function el(html) { var d = document.createElement("div"); d.innerHTML = html; return d.firstElementChild; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }
  function kb(bytes) {
    if (bytes >= 1048576) return (bytes / 1048576).toFixed(2) + " MB";
    if (bytes >= 1024) return Math.round(bytes / 1024) + " KB";
    return bytes + " B";
  }

  if (!LS) {
    app.appendChild(el('<div class="card"><h2>Sin acceso</h2><div class="alert">' +
      'Este navegador no permite leer el almacenamiento. Casi siempre es <strong>navegación privada</strong>. ' +
      'Sal del modo privado y vuelve a abrir esta página.</div></div>'));
    return;
  }

  // ── Inventario. WebKit cuenta la cuota en UTF-16: 2 bytes por carácter, clave incluida. ──
  var items = [], total = 0;
  try {
    for (var i = 0; i < LS.length; i++) {
      var k = LS.key(i);
      var v = LS.getItem(k) || "";
      var bytes = (k.length + v.length) * 2;
      total += bytes;
      items.push({ k: k, bytes: bytes, len: v.length });
    }
  } catch (e) {}
  items.sort(function (a, b) { return b.bytes - a.bytes; });

  // El clinicId se deduce de las claves presentes: no dependemos de que la app esté cargada.
  var cid = null;
  for (var j = 0; j < items.length; j++) {
    var m = items[j].k.match(/^jcm_facephotos_(.+)$/);
    if (m && m[1] !== "local") { cid = m[1]; break; }
  }
  if (!cid) {
    for (var j2 = 0; j2 < items.length; j2++) {
      var m2 = items[j2].k.match(/^jcm_([A-Za-z0-9]{6,})_config$/);
      if (m2) { cid = m2[1]; break; }
    }
  }

  // ── 1. Total usado ──
  // La cuota depende del navegador: WebKit (Safari, y todo navegador en iOS) da ~5 MB por dominio;
  // Chrome/Firefox de escritorio dan ~10 MB. Asumir siempre 5 MB hacía que un Chrome topado a 10 MB
  // se mostrara como "100%" — cifra correcta por casualidad, explicación equivocada.
  var ua = navigator.userAgent || "";
  var esIOS = /iP(hone|ad|od)/.test(ua);
  var esSafari = esIOS || (/Safari/.test(ua) && !/Chrome|Chromium|Edg|OPR|Firefox/.test(ua));
  var LIMIT = esSafari ? 5 * 1024 * 1024 : 10 * 1024 * 1024;
  var navName = esSafari ? "Safari" : "este navegador";
  var pct = Math.min(100, Math.round(total / LIMIT * 100));
  var color = pct >= 85 ? "var(--bad)" : pct >= 60 ? "var(--warn)" : "var(--ok)";
  app.appendChild(el(
    '<div class="card"><h2>Espacio usado</h2>' +
    '<div class="big" style="color:' + color + '">' + kb(total) + ' <small>de ~' + (LIMIT / 1048576) + ' MB</small></div>' +
    '<div class="bar"><i style="width:' + Math.max(2, pct) + '%; background:' + color + '"></i></div>' +
    '<div class="note">' + pct + '% del límite que ' + navName + ' da a este dominio. ' +
    (pct >= 85
      ? '<strong style="color:#FF8FB0">Está lleno o casi lleno: esa es la causa del error al guardar.</strong>'
      : pct >= 60
        ? 'Va alto, pero todavía hay margen.'
        : 'Hay espacio de sobra. Si igual aparece el error, el problema es otro y hay que seguir buscando.') +
    '</div>' +
    '<div class="note" style="margin-top:8px">' + items.length + ' claves guardadas.</div></div>'
  ));

  // ── 2. Pendientes de sincronizar: lo primero que hay que saber antes de borrar nada ──
  var dirty = {}, dirtyCount = 0;
  try {
    var dk = "jcm_" + (cid ? cid + "_" : "") + "__dirty__";
    dirty = JSON.parse(LS.getItem(dk) || "{}") || {};
    dirtyCount = Object.keys(dirty).length;
  } catch (e) {}
  app.appendChild(el(
    '<div class="card"><h2>Pendientes de subir a la nube</h2>' +
    (dirtyCount
      ? '<div class="big" style="color:var(--bad)">' + dirtyCount + ' <small>' + (dirtyCount === 1 ? 'sección' : 'secciones') + '</small></div>' +
        '<div class="alert"><strong>No borres los datos de este navegador.</strong> Estas secciones existen solo en este ' +
        'aparato y aún no están respaldadas:<br><br>' +
        Object.keys(dirty).map(function (x) { return "· " + esc(x); }).join("<br>") +
        '<br><br>Conéctate a una red estable y espera a que el contador llegue a cero.</div>'
      : '<div class="big" style="color:var(--ok)">0</div>' +
        '<div class="okline">Todo lo de este aparato ya está respaldado en la nube.</div>') +
    '</div>'
  ));

  // ── 3. Fotos faciales: el acumulador que sospechamos ──
  var faceKey = "jcm_facephotos_" + (cid || "local");
  var faceRaw = LS.getItem(faceKey);
  if (!faceRaw) {
    for (var f = 0; f < items.length; f++) {
      if (items[f].k.indexOf("jcm_facephotos_") === 0) { faceKey = items[f].k; faceRaw = LS.getItem(faceKey); break; }
    }
  }
  if (faceRaw) {
    var faces = null;
    try { faces = JSON.parse(faceRaw); } catch (e) {}
    var faceBytes = (faceKey.length + faceRaw.length) * 2;
    var rows = "", nPhotos = 0, nBackedUp = 0, bytesBackedUp = 0;
    if (faces && typeof faces === "object") {
      var pids = Object.keys(faces);
      var per = pids.map(function (pid) {
        var views = faces[pid] || {}, b = 0, n = 0;
        Object.keys(views).forEach(function (vw) {
          var val = views[vw];
          if (typeof val === "string") { b += val.length * 2; n++; }
        });
        // ¿Está respaldada en Firebase Storage? La URL vive en el kv sincronizado.
        var backed = false;
        try {
          var u = LS.getItem("jcm_" + (cid ? cid + "_" : "") + "fpurl_" + pid);
          if (u) { var pu = JSON.parse(u); backed = !!(pu && Object.keys(pu).length >= n && n > 0); }
        } catch (e) {}
        nPhotos += n;
        if (backed) { nBackedUp += n; bytesBackedUp += b; }
        return { pid: pid, bytes: b, n: n, backed: backed };
      }).sort(function (a, b) { return b.bytes - a.bytes; });

      rows = per.map(function (p) {
        return '<tr><td class="k">' + esc(p.pid.slice(0, 18)) + ' <span style="color:var(--mute)">· ' + p.n +
          (p.n === 1 ? ' foto' : ' fotos') + '</span>' +
          (p.backed ? '<span class="tag ok">en la nube</span>' : '<span class="tag bad">solo aquí</span>') +
          '</td><td class="v">' + kb(p.bytes) + '</td></tr>';
      }).join("");
    }
    var sharePct = total ? Math.round(faceBytes / total * 100) : 0;
    app.appendChild(el(
      '<div class="card"><h2>Fotos del rostro</h2>' +
      '<div class="big" style="color:' + (sharePct >= 40 ? "var(--bad)" : "var(--text)") + '">' + kb(faceBytes) +
      ' <small>= ' + sharePct + '% de todo</small></div>' +
      '<div class="note" style="margin-top:9px">' + nPhotos + ' fotos guardadas en este aparato. ' +
      '<strong>' + nBackedUp + '</strong> ya están respaldadas en la nube ' +
      '(' + kb(bytesBackedUp) + ' que se podrían liberar sin perder nada).</div>' +
      (rows ? '<table style="margin-top:12px">' + rows + '</table>' : "") +
      '</div>'
    ));
  }

  // ── 4. Resumen por tipo de clave ────────────────────────────────────────────
  // Con cientos de claves, la lista de las 30 más grandes engaña: 200 claves medianas del mismo
  // tipo pesan más que la mayor de todas y no aparecen. Se agrupan por familia (fpurl_…, pcons_…)
  // colapsando el id del paciente, que es lo que multiplica las claves.
  function esId(p) {
    return p === "p" || /^\d+$/.test(p) || /^[0-9a-f]{8,}$/i.test(p) ||
           (/\d/.test(p) && /[a-z]/i.test(p) && p.length >= 6);
  }
  function familia(k) {
    var partes = k.split("_"), out = [], corto = false;
    for (var i = 0; i < partes.length; i++) {
      if (esId(partes[i])) { corto = true; break; }
      out.push(partes[i]);
    }
    return (corto && out.length) ? out.join("_") + "_…" : k;
  }
  var fams = {};
  items.forEach(function (it) {
    var nice = it.k.replace(/^jcm_/, "").replace(cid ? new RegExp("^" + cid + "_") : /^$/, "");
    var f = familia(nice);
    if (!fams[f]) fams[f] = { bytes: 0, n: 0 };
    fams[f].bytes += it.bytes; fams[f].n++;
  });
  var famList = Object.keys(fams).map(function (f) {
    return { f: f, bytes: fams[f].bytes, n: fams[f].n };
  }).sort(function (a, b) { return b.bytes - a.bytes; });

  app.appendChild(el(
    '<div class="card"><h2>Resumen por tipo</h2>' +
    '<div class="note">Agrupa las claves que se repiten por paciente. Aquí se ve el bulto real.</div>' +
    '<table style="margin-top:12px">' +
    famList.slice(0, 18).map(function (g) {
      var pc = total ? Math.round(g.bytes / total * 100) : 0;
      return '<tr><td class="k">' + esc(g.f) +
        (g.n > 1 ? ' <span style="color:var(--mute)">× ' + g.n + '</span>' : "") +
        (pc >= 10 ? '<span class="tag warn">' + pc + '%</span>' : "") +
        '</td><td class="v">' + kb(g.bytes) + '</td></tr>';
    }).join("") +
    '</table></div>'
  ));

  // ── 5. Dentro del bloque más pesado ─────────────────────────────────────────
  // Saber que "los consentimientos pesan 5 MB" no dice qué recortar: no es lo mismo que el bulto
  // sean las firmas (van a Storage) que el texto legal repetido en cada copia (se deduplica contra
  // la plantilla). Se abre el registro más grande y se pesa campo por campo.
  // El registro a abrir es el mayor de la familia que más pesa EN TOTAL, no la clave más grande a
  // secas: 70 consentimientos de 73 KB pesan más que una sola clave de fotos de 2.9 MB, y es el
  // consentimiento el que hay que entender para saber qué recortar.
  var famTop = famList[0] ? famList[0].f : null;
  var mayor = null;
  if (famTop) {
    for (var q = 0; q < items.length; q++) {
      var nq = items[q].k.replace(/^jcm_/, "").replace(cid ? new RegExp("^" + cid + "_") : /^$/, "");
      if (familia(nq) === famTop) { mayor = items[q]; break; } // items ya viene de mayor a menor
    }
  }
  if (mayor && mayor.bytes > 20 * 1024) {
    var obj = null;
    try { obj = JSON.parse(LS.getItem(mayor.k)); } catch (e) {}
    // Solo tiene sentido en un registro con campos; un array grande (patients) no se desglosa así.
    if (obj && typeof obj === "object" && !Array.isArray(obj)) {
      var campos = Object.keys(obj).map(function (f) {
        var b = 0;
        try { b = (JSON.stringify(obj[f]) || "").length * 2; } catch (e) {}
        var v = obj[f];
        var esImagen = typeof v === "string" && v.indexOf("data:image") === 0;
        // Una firma puede venir anidada (medico.sig), no solo suelta en la raíz.
        if (!esImagen && v && typeof v === "object" && !Array.isArray(v)) {
          try {
            esImagen = Object.keys(v).some(function (sub) {
              return typeof v[sub] === "string" && v[sub].indexOf("data:image") === 0;
            });
          } catch (e) {}
        }
        return { f: f, bytes: b, img: esImagen };
      }).sort(function (a, b) { return b.bytes - a.bytes; });

      var imgBytes = 0, txtBytes = 0;
      campos.forEach(function (c) { if (c.img) imgBytes += c.bytes; else txtBytes += c.bytes; });

      app.appendChild(el(
        '<div class="card"><h2>Dentro del registro más pesado</h2>' +
        '<div class="note"><span class="k" style="font-family:ui-monospace,monospace">' +
        esc(mayor.k.replace(/^jcm_/, "").replace(cid ? new RegExp("^" + cid + "_") : /^$/, "")) +
        '</span> · ' + kb(mayor.bytes) + '. Qué lo hace pesar:</div>' +
        '<table style="margin-top:12px">' +
        campos.slice(0, 12).map(function (c) {
          return '<tr><td class="k">' + esc(c.f) +
            (c.img ? '<span class="tag bad">imagen</span>' : "") +
            '</td><td class="v">' + kb(c.bytes) + '</td></tr>';
        }).join("") +
        '</table>' +
        '<div class="note" style="margin-top:12px">Imágenes/firmas: <strong>' + kb(imgBytes) +
        '</strong> · texto y datos: <strong>' + kb(txtBytes) + '</strong>.</div></div>'
      ));
    }
  }

  // ── 6. Restos de la migración de consentimientos ────────────────────────────
  // Los consentimientos pasaron de "un array por paciente" (pcons_<pid>) a "un documento por
  // consentimiento" (pcons_<pid>_<ts>) con índice en pconsm_<pid>. patConsents() (jc-admin-b.jsx)
  // deja de mirar la clave vieja en cuanto existe el manifest, y la migración nunca la borra: queda
  // ocupando espacio sin que nada la lea. Se listan solo las que tienen manifest — sin manifest la
  // clave vieja SIGUE SIENDO la buena y tocarla perdería los consentimientos.
  var restos = [], restosBytes = 0, huerfanas = 0;
  items.forEach(function (it) {
    var n = it.k.replace(/^jcm_/, "").replace(cid ? new RegExp("^" + cid + "_") : /^$/, "");
    if (n.indexOf("pcons_") !== 0) return;
    if (/_\d{13}$/.test(n)) return;             // formato nuevo: es el vivo
    var pid = n.slice("pcons_".length);
    var man = null;
    try { man = JSON.parse(LS.getItem("jcm_" + (cid ? cid + "_" : "") + "pconsm_" + pid)); } catch (e) {}
    if (Array.isArray(man) && man.length > 0) { restos.push({ pid: pid, bytes: it.bytes, n: man.length }); restosBytes += it.bytes; }
    else huerfanas++;
  });
  if (restos.length || huerfanas) {
    var pctR = total ? Math.round(restosBytes / total * 100) : 0;
    app.appendChild(el(
      '<div class="card"><h2>Restos de la migración</h2>' +
      (restos.length
        ? '<div class="big" style="color:var(--warn)">' + kb(restosBytes) + ' <small>= ' + pctR + '% de todo</small></div>' +
          '<div class="note" style="margin-top:9px">' + restos.length +
          (restos.length === 1 ? ' clave antigua de consentimientos que ya nadie lee' : ' claves antiguas de consentimientos que ya nadie lee') +
          '. Sus consentimientos están guardados en el formato nuevo; esto es una copia que quedó atrás.</div>' +
          '<table style="margin-top:12px">' +
          restos.sort(function (a, b) { return b.bytes - a.bytes; }).slice(0, 12).map(function (r) {
            return '<tr><td class="k">' + esc(r.pid.slice(0, 22)) +
              ' <span style="color:var(--mute)">· ' + r.n + ' en el formato nuevo</span>' +
              '</td><td class="v">' + kb(r.bytes) + '</td></tr>';
          }).join("") + '</table>'
        : '<div class="okline">No hay claves antiguas con copia nueva.</div>') +
      (huerfanas
        ? '<div class="alert" style="margin-top:12px"><strong>' + huerfanas +
          (huerfanas === 1 ? ' clave antigua SIN copia nueva.</strong> ' : ' claves antiguas SIN copia nueva.</strong> ') +
          'Esas siguen siendo las buenas: no se pueden borrar sin perder consentimientos.</div>'
        : "") +
      '</div>'
    ));
  }

  // ── 7. Todo el desglose, de mayor a menor ──
  var top = items.slice(0, 30);
  app.appendChild(el(
    '<div class="card"><h2>Todo, de mayor a menor</h2><table>' +
    top.map(function (it) {
      var nice = it.k.replace(/^jcm_/, "").replace(cid ? new RegExp("^" + cid + "_") : /^$/, "");
      var pc = total ? Math.round(it.bytes / total * 100) : 0;
      return '<tr><td class="k">' + esc(nice) + (pc >= 10 ? ' <span class="tag warn">' + pc + '%</span>' : "") +
        '</td><td class="v">' + kb(it.bytes) + '</td></tr>';
    }).join("") +
    '</table>' + (items.length > 30 ? '<div class="note" style="margin-top:10px">y ' + (items.length - 30) + ' claves más, todas pequeñas.</div>' : "") +
    '</div>'
  ));

  // ── 5. Sondeo de espacio libre (opt-in): escribe y borra una clave propia, nunca toca datos ──
  var probeCard = el(
    '<div class="card"><h2>¿Cuánto espacio queda?</h2>' +
    '<div class="note">Mide el margen real escribiendo una clave de prueba propia y borrándola enseguida. ' +
    'No lee ni modifica ninguna clave de la clínica.</div>' +
    '<button id="probe">Medir espacio libre</button><div id="probeout"></div></div>'
  );
  app.appendChild(probeCard);

  document.getElementById("probe").addEventListener("click", function () {
    var btn = this, out = document.getElementById("probeout");
    btn.disabled = true; btn.textContent = "Midiendo…";
    setTimeout(function () {
      // Se corta en 6 MB: pasado el límite de Safari, seguir llenando no aporta nada al diagnóstico
      // y dejaría la clave de prueba más grande de la cuenta si algo interrumpe la medición.
      var PK = "__jcm_diag_probe__", free = 0, MAX = 6 * 1024 * 1024, tope = false;
      try {
        var chunk = new Array(1024 * 8 + 1).join("x"); // 8K chars = 16 KB UTF-16
        var buf = "";
        while (free < MAX) {
          try { LS.setItem(PK, buf + chunk); buf += chunk; free = buf.length * 2; }
          catch (e) { break; }
        }
        tope = free >= MAX;
      } catch (e) {}
      finally { try { LS.removeItem(PK); } catch (e) {} }

      var cifra = (tope ? "más de " : "") + kb(free);
      out.innerHTML = (!tope && free < 120 * 1024)
        ? '<div class="alert" style="margin-top:13px"><strong>Quedan ' + cifra + ' libres.</strong><br>' +
          'Es muy poco: por eso falla al guardar una cita. Hay que liberar espacio.</div>'
        : '<div class="okline" style="margin-top:13px"><strong>Quedan ' + cifra + ' libres.</strong><br>' +
          'Hay margen suficiente para guardar. Si el error igual aparece, la causa es otra.</div>';
      btn.textContent = "Medir de nuevo"; btn.disabled = false;
    }, 60);
  });

})();
</script>

</body>
</html>
